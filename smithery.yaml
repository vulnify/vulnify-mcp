# Remote Streamable HTTP server. Smithery does not build or host this process.
# Publish a URL server: https://smithery.ai/docs/build/publish
#   smithery mcp publish "https://mcp.vulnify.io/mcp" -n @vulnify/mcp
# Clients sign in with OAuth. This config does not send a Vulnify API key.

startCommand:
  type: http
  url: https://mcp.vulnify.io/mcp
  configSchema:
    type: object
    properties: {}

metadata:
  homepage: https://www.vulnify.io
  documentation: https://docs.vulnify.io/mcp/
  repository: https://github.com/vulnify/vulnify-mcp
