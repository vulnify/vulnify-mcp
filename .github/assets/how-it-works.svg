<svg xmlns="http://www.w3.org/2000/svg" width="840" height="180" viewBox="0 0 840 180" role="img" aria-labelledby="title desc">
  <title id="title">How a Vulnify decision works</title>
  <desc id="desc">An agent action is sent to Vulnify, which returns ALLOW, REVIEW, or BLOCK.</desc>
  <rect width="840" height="180" rx="16" fill="#06080F"/>
  <rect x="24" y="50" width="176" height="80" rx="12" fill="#0B1F4B"/>
  <text x="112" y="86" text-anchor="middle" fill="#F4F6F8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500">Agent action</text>
  <text x="112" y="108" text-anchor="middle" fill="#B7C0CC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">read, export, send</text>
  <path d="M208 90 H248" stroke="#C5D2FF" stroke-width="1.5" fill="none"/>
  <path d="M242 84 L250 90 L242 96" stroke="#C5D2FF" stroke-width="1.5" fill="none"/>
  <rect x="258" y="42" width="168" height="96" rx="12" fill="#3D6DFF"/>
  <text x="342" y="86" text-anchor="middle" fill="#F4F6F8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="500">Vulnify</text>
  <text x="342" y="110" text-anchor="middle" fill="#C5D2FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">finalDecision</text>
  <path d="M434 90 H474" stroke="#C5D2FF" stroke-width="1.5" fill="none"/>
  <path d="M468 84 L476 90 L468 96" stroke="#C5D2FF" stroke-width="1.5" fill="none"/>
  <rect x="486" y="16" width="330" height="44" rx="10" fill="#0B1F4B"/>
  <circle cx="514" cy="38" r="5" fill="#9DDEC0"/>
  <text x="530" y="43" fill="#9DDEC0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">ALLOW</text>
  <text x="600" y="43" fill="#B7C0CC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">the action may run</text>
  <rect x="486" y="68" width="330" height="44" rx="10" fill="#0B1F4B"/>
  <circle cx="514" cy="90" r="5" fill="#E6C98A"/>
  <text x="530" y="95" fill="#E6C98A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">REVIEW</text>
  <text x="608" y="95" fill="#B7C0CC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">a person decides</text>
  <rect x="486" y="120" width="330" height="44" rx="10" fill="#0B1F4B"/>
  <circle cx="514" cy="142" r="5" fill="#F0B2AC"/>
  <text x="530" y="147" fill="#F0B2AC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">BLOCK</text>
  <text x="598" y="147" fill="#B7C0CC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">the action does not run</text>
</svg>
